[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "certmgr-backend"
version = "1.0.0"
description = "Enterprise SSL Certificate Lifecycle Management Platform - backend"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "CertMgr Platform Team" }]
dependencies = [
    "fastapi>=0.115",
    "sqlalchemy>=2.0",
    "pydantic>=2.10",
    "celery>=5.4",
    "cryptography>=44",
]

[project.scripts]
certmgr = "cli.certmgr:app"

[tool.setuptools]
packages = { find = { include = ["app*", "cli*"] } }

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP"]
ignore = ["S101", "B008", "S603", "S608", "E501", "UP042", "UP046", "UP047"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S107", "S108", "E402"]
"alembic/*" = ["E501"]
# Demo seed script: uses random for mock-data variance (not security), long literal lines
"scripts/seed_demo.py" = ["E501", "S311", "S105", "S106", "S108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.bandit]
exclude_dirs = ["tests", "alembic"]

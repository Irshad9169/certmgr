global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: certmgr-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
    # If CERTMGR_METRICS_AUTH_TOKEN is set, uncomment and add a bearer token:
    # authorization:
    #   credentials_file: /etc/prometheus/certmgr-metrics-token

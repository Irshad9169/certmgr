# ── CertMgr reverse proxy ────────────────────────────────────────────────────
# Terminates TLS and proxies /api to the FastAPI backend; serves the React UI.

upstream certmgr_api {
    server api:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name certmgr.example.com;

    # ACME HTTP-01 challenge for the platform's own certificate (optional)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name certmgr.example.com;

    # Platform certificate (issue via CertMgr itself once deployed)
    ssl_certificate     /etc/letsencrypt/live/certmgr.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/certmgr.example.com/privkey.pem;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    root /usr/share/nginx/html;
    index index.html;

    # SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API
    location /api/ {
        proxy_pass http://certmgr_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        client_max_body_size 15m;
    }

    # Swagger / OpenAPI
    location /docs { proxy_pass http://certmgr_api; }
    location /redoc { proxy_pass http://certmgr_api; }
    location /openapi.json { proxy_pass http://certmgr_api; }
    location /health { proxy_pass http://certmgr_api; }
    location /metrics { proxy_pass http://certmgr_api; }

    # Static assets cache
    location ~* \.(js|css|png|jpg|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
